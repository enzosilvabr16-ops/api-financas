services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: api-financas-sqlserver

    ports:
      - "1434:1433"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Coti@2026"

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - api-financas-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Coti@2026' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  adminer:
    image: adminer:latest
    container_name: api-financas-adminer

    ports:
      - "5056:8080"

    environment:
      ADMINER_DEFAULT_SERVER: sqlserver
      ADMINER_DESIGN: pepa-linha

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - api-financas-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r \"exit(@file_get_contents('http://localhost:8080') === false ? 1 : 0);\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:4-management
    container_name: api-financas-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: coti
      RABBITMQ_DEFAULT_PASS: coti

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - api-financas-network

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


volumes:

  sqlserver_data:
    name: api-financas-sqlserver-data

  rabbitmq_data:
    name: api-financas-rabbitmq-data


networks:

  api-financas-network:
    name: api-financas-network
    driver: bridge